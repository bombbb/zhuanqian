plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'org.zq'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// 指定 Spring Boot 主类
springBoot {
    mainClass = 'com.zq.TradingApplication'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.google.guava:guava:31.0.1-jre'  // 版本根据需要进行调整

    // ===== Spring Boot 核心 =====
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'

    // ===== Lombok =====
    compileOnly 'org.projectlombok:lombok:1.18.34'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'

    // ===== 你原来的依赖 =====
    implementation 'org.java-websocket:Java-WebSocket:1.5.7'
    implementation 'com.google.code.gson:gson:2.10.1'

    // ===== 日志 =====
    // Spring Boot已经包含了slf4j和logback，不需要单独引入
    // implementation 'org.slf4j:slf4j-api:2.0.13'
    // implementation 'ch.qos.logback:logback-classic:1.5.13'

    // ===== 测试 =====
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.test {
    useJUnitPlatform {
        excludeTags 'integration'
        excludeTags 'manual'
    }
}

tasks.register('updateMongoConfig', Test) {
    group = 'verification'
    description = 'Manually update MongoDB strategy_config with current recommended settings.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'manual'
    }
    testLogging {
        showStandardStreams = true
    }
}
